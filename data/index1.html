<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baseball Scoreboard</title><link rel="stylesheet" href="/style.css"><style>body{margin:0;padding:20px}.menu a{margin-right:15px}.wrap{overflow:auto}#board{width:100%;background:#000;border-radius:8px}</style></head><body><div class="menu"><a href="/control.html">Steuerung</a><a href="/config.html">Konfiguration</a></div><div class="wrap"><svg id="board" viewBox="0 0 1800 700"></svg></div><script>const svg=document.getElementById('board');function t(x,y,s){svg.insertAdjacentHTML('beforeend',`<text x="${x}" y="${y}" fill="white" font-size="${s}">$${''}</text>`)}function draw(){svg.innerHTML='';svg.insertAdjacentHTML('beforeend','<text x="20" y="40" fill="white" font-size="28">BASEBALL SCOREBOARD</text>')}draw();async function loadState(){try{const r=await fetch('/api/state');const d=await r.json();svg.innerHTML='';svg.insertAdjacentHTML('beforeend',`<text x="20" y="40" fill="white" font-size="28">AT BAT ${d.atBat}</text><text x="20" y="80" fill="white" font-size="22">Balls:${d.balls} Strikes:${d.strikes} Outs:${d.outs}</text><text x="20" y="120" fill="white" font-size="22">Zeit ${String(d.hour).padStart(2,'0')}:${String(d.minute).padStart(2,'0')}</text>`);let y=220;svg.insertAdjacentHTML('beforeend','<text x="20" y="180" fill="white">Team A</text>');d.inningsA.forEach((v,i)=>svg.insertAdjacentHTML('beforeend',`<text x="${20+i*70}" y="220" fill="#ff4444">${v}</text>`));svg.insertAdjacentHTML('beforeend',`<text x="800" y="220" fill="#ff4444">R:${d.runsA} H:${d.hitsA} E:${d.errorsA}</text>`);svg.insertAdjacentHTML('beforeend','<text x="20" y="320" fill="white">Team B</text>');d.inningsB.forEach((v,i)=>svg.insertAdjacentHTML('beforeend',`<text x="${20+i*70}" y="360" fill="#44ff44">${v}</text>`));svg.insertAdjacentHTML('beforeend',`<text x="800" y="360" fill="#44ff44">R:${d.runsB} H:${d.hitsB} E:${d.errorsB}</text>`);}catch(e){console.log(e)}}loadState();setInterval(loadState,1000);</script><script src="/app.js"></script></body></html>
