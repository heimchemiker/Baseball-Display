<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Baseball Scoreboard - Konfiguration</title>

style.css">

<style>

.container
{
    max-width:1200px;
    margin:auto;
}

.card
{
    background:#222;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
}

.row
{
    display:flex;
    gap:20px;
    margin-bottom:10px;
    flex-wrap:wrap;
}

.field
{
    display:flex;
    flex-direction:column;
    min-width:250px;
}

input,
select,
button
{
    padding:8px;
    border-radius:5px;
}

.color-picker
{
    width:80px;
    height:40px;
}

h1,h2
{
    color:white;
}

label
{
    color:white;
}

body
{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

button
{
    cursor:pointer;
}

.success
{
    color:#00ff00;
}

.error
{
    color:#ff4444;
}

</style>

</head>

<body>

<div class="container">

<h1>Scoreboard Konfiguration</h1>

<p>
/Vorschau</a> |
.html">Bedienung</a>
</p>

<form id="configForm">

<div class="card">

<h2>WLAN</h2>

<div class="row">

<div class="field">
<label>Betriebsmodus</label>

<select id="wifiMode">
<option value="ap">Nur AP</option>
<option value="sta">Nur WLAN</option>
<option value="apsta">AP + WLAN</option>
</select>

</div>

<div class="field">
<label>Gefundene WLANs</label>

<select id="wifiList"></select>

<button type="button"
onclick="scanWifi()">
Scannen
</button>

</div>

</div>

<div class="row">

<div class="field">
<label>SSID</label>
<input id="wifiSSID">
</div>

<div class="field">
<label>Passwort</label>
<input
type="password"
id="wifiPassword">
</div>

</div>

</div>

<div class="card">

<h2>MQTT</h2>

<div class="row">

<div class="field">
<label>Broker</label>
<input id="mqttHost">
</div>

<div class="field">
<label>Port</label>
<input
id="mqttPort"
type="number">
</div>

</div>

<div class="row">

<div class="field">
<label>Benutzer</label>
<input id="mqttUser">
</div>

<div class="field">
<label>Passwort</label>
<input
type="password"
id="mqttPassword">
</div>

</div>

</div>

<div class="card">

<h2>Zeit</h2>

<div class="row">

<div class="field">

<label>NTP aktiv</label>

<select id="ntpEnabled">
<option value="true">Ja</option>
<option value="false">Nein</option>
</select>

</div>

<div class="field">

<label>NTP Server</label>

<input
id="ntpServer">

</div>

</div>

</div>

<div class="card">

<h2>Anzeige</h2>

<div class="row">

<div class="field">

<label>Theme</label>

<select id="theme">
<option value="dark">
Dark
</option>

<option value="light">
Light
</option>

</select>

</div>

</div>

</div>

<div class="card">

<h2>Farben</h2>

<div class="row">

<div class="field">
<label>Global</label>
<input
type="color"
id="colorGlobal">
</div>

<div class="field">
<label>Team A</label>
<input
type="color"
id="colorTeamA">
</div>

<div class="field">
<label>Team B</label>
<input
type="color"
id="colorTeamB">
</div>

</div>

<div class="row">

<div class="field">
<label>Uhrzeit</label>
<input
type="color"
id="colorClock">
</div>

<div class="field">
<label>Balls</label>
<input
type="color"
id="colorBalls">
</div>

<div class="field">
<label>Strikes</label>
<input
type="color"
id="colorStrikes">
</div>

<div class="field">
<label>Outs</label>
<input
type="color"
id="colorOuts">
</div>

</div>

<div class="row">

<div class="field">
<label>Aktuelles Inning</label>
<input
type="color"
id="highlightCurrentInning">
</div>

</div>

</div>

<div class="card">

<h2>Helligkeit</h2>

<div class="row">

<div class="field">

<label>Sensor aktiv</label>

<select id="brightnessSensor">
<option value="true">Ja</option>
<option value="false">Nein</option>
</select>

</div>

</div>

<div class="row">

<div class="field">
<label>Minimum Lux</label>
<input
type="number"
id="luxMin">
</div>

<div class="field">
<label>Maximum Lux</label>
<input
type="number"
id="luxMax">
</div>

</div>

<div class="row">

<div class="field">
<label>Minimum Helligkeit</label>
<input
type="number"
min="0"
max="255"
id="brightnessMin">
</div>

<div class="field">
<label>Maximum Helligkeit</label>
<input
type="number"
min="0"
max="255"
id="brightnessMax">
</div>

</div>

</div>

<button type="submit">
Speichern
</button>

<div id="status"></div>

</form>

</div>

<script>

async function loadConfig()
{
    const response =
        await fetch(
            "/api/config"
        );

    const cfg =
        await response.json();

    document.getElementById(
        "wifiSSID"
    ).value =
        cfg.wifiSSID || "";

    document.getElementById(
        "wifiPassword"
    ).value =
        cfg.wifiPassword || "";

    document.getElementById(
        "mqttHost"
    ).value =
        cfg.mqttHost || "";

    document.getElementById(
        "mqttPort"
    ).value =
        cfg.mqttPort || 1883;

    document.getElementById(
        "mqttUser"
    ).value =
        cfg.mqttUser || "";

    document.getElementById(
        "mqttPassword"
    ).value =
        cfg.mqttPassword || "";

    document.getElementById(
        "ntpEnabled"
    ).value =
        String(cfg.ntpEnabled);

    document.getElementById(
        "ntpServer"
    ).value =
        cfg.ntpServer || "";

    document.getElementById(
        "theme"
    ).value =
        cfg.theme || "dark";

    [
        "colorGlobal",
        "colorTeamA",
        "colorTeamB",
        "colorClock",
        "colorBalls",
        "colorStrikes",
        "colorOuts",
        "highlightCurrentInning"
    ].forEach(id =>
    {
        document.getElementById(id).value =
            cfg[id];
    });

    document.getElementById(
        "brightnessSensor"
    ).value =
        String(cfg.brightnessSensor);

    document.getElementById(
        "luxMin"
    ).value =
        cfg.luxMin;

    document.getElementById(
        "luxMax"
    ).value =
        cfg.luxMax;

    document.getElementById(
        "brightnessMin"
    ).value =
        cfg.brightnessMin;

    document.getElementById(
        "brightnessMax"
    ).value =
        cfg.brightnessMax;
}

async function scanWifi()
{
    const response =
        await fetch(
            "/api/wifi/scan"
        );

    const networks =
        await response.json();

    const list =
        document.getElementById(
            "wifiList"
        );

    list.innerHTML = "";

    networks.forEach(net =>
    {
        const option =
            document.createElement(
                "option"
            );

        option.value =
            net.ssid;

        option.text =
            `${net.ssid} (${net.rssi} dBm)`;

        list.appendChild(
            option
        );
    });

    list.onchange =
        function()
        {
            document.getElementById(
                "wifiSSID"
            ).value =
                this.value;
        };
}

document
.getElementById(
    "configForm"
)
.addEventListener(
    "submit",
    async function(e)
    {
        e.preventDefault();

        const config =
        {
            wifiSSID:
                wifiSSID.value,

            wifiPassword:
                wifiPassword.value,

            mqttHost:
                mqttHost.value,

            mqttPort:
                parseInt(
                    mqttPort.value
                ),

            mqttUser:
                mqttUser.value,

            mqttPassword:
                mqttPassword.value,

            ntpEnabled:
                ntpEnabled.value === "true",

            ntpServer:
                ntpServer.value,

            theme:
                theme.value,

            colorGlobal:
                colorGlobal.value,

            colorTeamA:
                colorTeamA.value,

            colorTeamB:
                colorTeamB.value,

            colorClock:
                colorClock.value,

            colorBalls:
                colorBalls.value,

            colorStrikes:
                colorStrikes.value,

            colorOuts:
                colorOuts.value,

            highlightCurrentInning:
                highlightCurrentInning.value,

            brightnessSensor:
                brightnessSensor.value === "true",

            luxMin:
                parseFloat(
                    luxMin.value
                ),

            luxMax:
                parseFloat(
                    luxMax.value
                ),

            brightnessMin:
                parseInt(
                    brightnessMin.value
                ),

            brightnessMax:
                parseInt(
                    brightnessMax.value
                )
        };

        const response =
            await fetch(
                "/api/config",
                {
                    method:"POST",
                    headers:
                    {
                        "Content-Type":
                        "application/json"
                    },
                    body:
                    JSON.stringify(
                        config
                    )
                });

        const status =
            document.getElementById(
                "status"
            );

        if(response.ok)
        {
            status.className =
                "success";

            status.innerText =
                "Konfiguration gespeichert";
        }
        else
        {
            status.className =
                "error";

            status.innerText =
                "Fehler beim Speichern";
        }
    });

loadConfig();

</script>
/config.js
</body>
</html>
