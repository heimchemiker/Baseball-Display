<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baseball Scoreboard - Konfiguration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="index.html">Vorschau</a>
    <a href="control.html">Bedienung</a>
  </nav>

  <div class="container">
    <h1>Scoreboard Konfiguration</h1>

    <form id="configForm">

      <div class="card">
        <h2>WLAN</h2>
        <div class="row">
          <div class="field">
            <label for="wifiMode">Betriebsmodus</label>
            <select id="wifiMode">
              <option value="ap">Nur AP</option>
              <option value="sta">Nur WLAN</option>
              <option value="apsta">AP + WLAN</option>
            </select>
          </div>

          <div class="field">
            <label for="wifiList">Gefundene WLANs</label>
            <select id="wifiList"></select>
            <button type="button" onclick="scanWifi()">Scannen</button>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="wifiSSID">SSID</label>
            <input id="wifiSSID" autocomplete="off">
          </div>

          <div class="field">
            <label for="wifiPassword">Passwort</label>
            <input id="wifiPassword" type="password" autocomplete="new-password">
          </div>
        </div>
      </div>

      <div class="card">
        <h2>MQTT</h2>
        <div class="row">
          <div class="field">
            <label for="mqttHost">Broker</label>
            <input id="mqttHost">
          </div>
          <div class="field">
            <label for="mqttPort">Port</label>
            <input id="mqttPort" type="number">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="mqttUser">Benutzer</label>
            <input id="mqttUser">
          </div>
          <div class="field">
            <label for="mqttPassword">Passwort</label>
            <input id="mqttPassword" type="password">
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Zeit</h2>
        <div class="row">
          <div class="field">
            <label for="ntpEnabled">NTP aktiv</label>
            <select id="ntpEnabled">
              <option value="true">Ja</option>
              <option value="false">Nein</option>
            </select>
          </div>

          <div class="field">
            <label for="ntpServer">NTP Server</label>
            <input id="ntpServer">
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Anzeige</h2>
        <div class="row">
          <div class="field">
            <label for="theme">Theme</label>
            <select id="theme">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Farben</h2>
        <div class="row">
          <div class="field">
            <label for="colorGlobal">Global</label>
            <input id="colorGlobal" type="color">
          </div>
          <div class="field">
            <label for="colorTeamA">Team A</label>
            <input id="colorTeamA" type="color">
          </div>
          <div class="field">
            <label for="colorTeamB">Team B</label>
            <input id="colorTeamB" type="color">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="colorClock">Uhrzeit</label>
            <input id="colorClock" type="color">
          </div>
          <div class="field">
            <label for="colorBalls">Balls</label>
            <input id="colorBalls" type="color">
          </div>
          <div class="field">
            <label for="colorStrikes">Strikes</label>
            <input id="colorStrikes" type="color">
          </div>
          <div class="field">
            <label for="colorOuts">Outs</label>
            <input id="colorOuts" type="color">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="highlightCurrentInning">Aktuelles Inning</label>
            <input id="highlightCurrentInning" type="color">
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Helligkeit</h2>
        <div class="row">
          <div class="field">
            <label for="brightnessSensor">Sensor aktiv</label>
            <select id="brightnessSensor">
              <option value="true">Ja</option>
              <option value="false">Nein</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="luxMin">Minimum Lux</label>
            <input id="luxMin" type="number">
          </div>
          <div class="field">
            <label for="luxMax">Maximum Lux</label>
            <input id="luxMax" type="number">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="brightnessMin">Minimum Helligkeit</label>
            <input id="brightnessMin" type="number" min="0" max="255">
          </div>
          <div class="field">
            <label for="brightnessMax">Maximum Helligkeit</label>
            <input id="brightnessMax" type="number" min="0" max="255">
          </div>
        </div>
      </div>

      <div class="buttons">
        <button type="submit">Speichern</button>
        <button type="button" onclick="restartDevice()">Neustart</button>
      </div>

      <div id="status"></div>

    </form>
  </div>

  <script src="config.js"></script>
</body>
</html>
